[project]
name = "ledgerflow-api"
version = "0.1.0"
description = "LedgerFlow HTTP API: document intake, review workflow and the transactional outbox."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.32.1",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "aio-pika>=9.5",
    "aioboto3>=13.3",
    "pyjwt[crypto]>=2.10",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.20",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "asgi-lifespan>=2.1",
    "testcontainers[postgres]>=4.15",
    "ruff>=0.8.4",
    "mypy>=1.14",
    "types-aioboto3[s3]>=13.3",
]

[project.scripts]
ledgerflow-relay = "ledgerflow_api.workers.outbox_relay:main"
ledgerflow-seed = "ledgerflow_api.seed:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerflow_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "B", "UP", "S", "C4", "DTZ", "SIM", "RET", "PT",
    "ASYNC", "TID", "RUF", "PL",
]
ignore = [
    "PLR0913", # FastAPI handlers legitimately take many injected parameters...
    "PLR0917", # ...and FastAPI resolves them by name, so positional count is irrelevant.
    "PLR2004", # Magic values read better inline in validators and tests.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0913"]
"migrations/**" = ["E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["asyncpg.*", "testcontainers.*", "asgi_lifespan.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
