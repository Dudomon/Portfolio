<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limpar Cache do Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #2d2d2d;
            padding: 40px;
            border-radius: 10px;
            max-width: 600px;
            text-align: center;
        }
        h1 { color: #FF6B00; }
        .success { color: #4ec9b0; font-size: 48px; }
        .info { color: #569cd6; margin: 20px 0; }
        button {
            background: #FF6B00;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            background: #e55f00;
        }
        pre {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 5px;
            text-align: left;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 Limpeza de Cache do Chatbot</h1>

        <div id="status">
            <p class="info">Clique no botão abaixo para limpar completamente o cache do chatbot</p>
            <button onclick="limparTudo()">🗑️ Limpar Tudo</button>
        </div>

        <div id="result" style="display: none;">
            <p class="success">✅</p>
            <h2 style="color: #4ec9b0;">Cache Limpo!</h2>
            <p class="info">Agora recarregue a página principal (Ctrl + Shift + R)</p>
            <pre id="details"></pre>
        </div>
    </div>

    <script>
        function limparTudo() {
            const removidos = [];

            // Lista de todas as chaves possíveis relacionadas ao chatbot
            const chaves = [
                'radioChatbotHistory',
                'radioChatbotVersion',
                'chatbotHistory',
                'chatHistory',
                'conversationHistory'
            ];

            // Remove cada chave
            chaves.forEach(chave => {
                if (localStorage.getItem(chave)) {
                    localStorage.removeItem(chave);
                    removidos.push(`✓ ${chave} removido`);
                }
            });

            // Limpa TUDO do localStorage (força bruta)
            const todasChaves = Object.keys(localStorage);
            todasChaves.forEach(chave => {
                if (chave.toLowerCase().includes('chat') ||
                    chave.toLowerCase().includes('bot') ||
                    chave.toLowerCase().includes('radio')) {
                    localStorage.removeItem(chave);
                    if (!removidos.includes(`✓ ${chave} removido`)) {
                        removidos.push(`✓ ${chave} removido`);
                    }
                }
            });

            // Limpa sessionStorage também
            sessionStorage.clear();

            // Mostra resultado
            document.getElementById('status').style.display = 'none';
            document.getElementById('result').style.display = 'block';

            if (removidos.length > 0) {
                document.getElementById('details').textContent = removidos.join('\n');
            } else {
                document.getElementById('details').textContent = '(Nenhum cache encontrado)';
            }

            // Recarrega a página após 3 segundos
            setTimeout(() => {
                window.location.href = window.location.origin;
            }, 3000);
        }

        // Auto-executa ao carregar (opcional)
        // limparTudo();
    </script>
</body>
</html>
