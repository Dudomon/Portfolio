version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: iptv-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: iptv_db
      MYSQL_USER: iptv_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-iptvpassword}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - iptv-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: iptv-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - iptv-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iptv-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://iptv_user:${MYSQL_PASSWORD:-iptvpassword}@mysql:3306/iptv_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      FLASK_ENV: ${FLASK_ENV:-production}
      STREAM_CHECK_INTERVAL: 60
      WORKERS: 4
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - stream_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - iptv-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery Worker for background tasks
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iptv-celery-worker
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: mysql+pymysql://iptv_user:${MYSQL_PASSWORD:-iptvpassword}@mysql:3306/iptv_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ./backend:/app
      - stream_logs:/app/logs
    depends_on:
      - mysql
      - redis
    networks:
      - iptv-network

  # Celery Beat for scheduled tasks
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iptv-celery-beat
    restart: unless-stopped
    command: celery -A app.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: mysql+pymysql://iptv_user:${MYSQL_PASSWORD:-iptvpassword}@mysql:3306/iptv_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    volumes:
      - ./backend:/app
    depends_on:
      - mysql
      - redis
    networks:
      - iptv-network

  # Frontend Admin Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: iptv-frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost/api}
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - iptv-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: iptv-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - iptv-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  stream_logs:
    driver: local
  nginx_logs:
    driver: local

networks:
  iptv-network:
    driver: bridge
