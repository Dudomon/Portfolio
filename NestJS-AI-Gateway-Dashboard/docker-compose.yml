# Local stack: PostgreSQL, Redis, the gateway and the dashboard.
#   cp .env.example .env   # then set ADMIN_TOKEN, API_KEY_PEPPER and provider keys
#   docker compose up --build
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gateway -d gateway']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot schema migration, kept out of the gateway's startup path so
  # several gateway replicas never race to migrate.
  migrate:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://gateway:gateway@postgres:5432/gateway
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://gateway:gateway@postgres:5432/gateway
      REDIS_URL: redis://redis:6379
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    environment:
      GATEWAY_URL: http://gateway:3000
    ports:
      - '3001:3001'
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  postgres-data:
