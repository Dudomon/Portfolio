name: ledgerflow

x-api-env: &api-env
  ENVIRONMENT: development
  LOG_JSON: "true"
  DATABASE_URL: postgresql+asyncpg://ledgerflow:${POSTGRES_PASSWORD}@postgres:5432/ledgerflow
  JWT_ALGORITHM: HS256
  JWT_SECRET: ${JWT_SECRET}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
  S3_BUCKET: ledgerflow-documents
  S3_REGION: us-east-1
  S3_ENDPOINT_URL: http://minio:9000
  S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  # MinIO without KMS rejects SSE-S3; production sets AES256.
  S3_SERVER_SIDE_ENCRYPTION: ""
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
  CORS_ORIGINS: '["http://localhost:5173","http://localhost:8080"]'

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ledgerflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ledgerflow
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerflow -d ledgerflow"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
                  mc mb --ignore-existing local/ledgerflow-documents"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  migrate:
    build: ./services/api
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: ./services/api
    environment: *api-env
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }

  outbox-relay:
    build: ./services/api
    command: ["ledgerflow-relay"]
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

  worker:
    build: ./services/worker
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ledgerflow-documents
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_USE_PATH_STYLE: "true"
      API_BASE_URL: http://api:8000/api/v1
      API_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      LLM_BASE_URL: https://api.openai.com/v1
      LLM_API_KEY: ${OPENAI_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
    ports: ["9090:9090"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      api: { condition: service_healthy }

  web:
    build: ./apps/web
    environment:
      API_UPSTREAM: http://api:8000
      CSP_CONNECT_SRC: http://localhost:9000
    ports: ["8080:8080"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
