name: 'data_platform_transformations'
version: '1.0.0'
config-version: 2

profile: 'bigquery'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  data_platform_transformations:
    staging:
      +materialized: view
      +schema: staging_data
    analytics:
      +materialized: table
      +schema: analytics_data
      +partition_by:
        field: transaction_date
        data_type: date
      +cluster_by: ["user_id"]

vars:
  start_date: '2024-01-01'
  lookback_days: 90
