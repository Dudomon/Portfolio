<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEBUG FORÇADO - Chatbot</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #0f0;
            padding: 20px;
        }
        .log {
            background: #111;
            padding: 10px;
            margin: 5px 0;
            border-left: 3px solid #0f0;
        }
        .error {
            border-left-color: #f00;
            color: #f00;
        }
        .warning {
            border-left-color: #ff0;
            color: #ff0;
        }
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            margin: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>🔍 DEBUG FORÇADO DO CHATBOT</h1>

    <button onclick="limparTudo()">🗑️ LIMPAR TUDO E RESETAR</button>
    <button onclick="mostrarHistorico()">📋 MOSTRAR HISTÓRICO</button>
    <button onclick="contarMensagens()">🔢 CONTAR MENSAGENS NO DOM</button>

    <div id="logs"></div>

    <script>
        function log(msg, type = 'log') {
            const div = document.createElement('div');
            div.className = 'log ' + type;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            document.getElementById('logs').appendChild(div);
            console.log(msg);
        }

        function limparTudo() {
            log('🧹 LIMPANDO TUDO...', 'warning');

            // Lista TODAS as chaves do localStorage
            const todasChaves = Object.keys(localStorage);
            log(`📦 Total de chaves no localStorage: ${todasChaves.length}`);

            todasChaves.forEach(chave => {
                log(`  - Removendo: ${chave}`);
                localStorage.removeItem(chave);
            });

            sessionStorage.clear();
            log('✅ TUDO LIMPO!', 'log');
            log('⚠️ Recarregue a página agora!', 'warning');

            setTimeout(() => {
                window.location.reload();
            }, 2000);
        }

        function mostrarHistorico() {
            log('📋 VERIFICANDO HISTÓRICO...', 'warning');

            const hist = localStorage.getItem('radioChatbotHistory');
            const version = localStorage.getItem('radioChatbotVersion');

            log(`Versão: ${version || 'NÃO DEFINIDA'}`);

            if (!hist) {
                log('❌ Nenhum histórico encontrado', 'error');
                return;
            }

            try {
                const parsed = JSON.parse(hist);
                log(`✅ Histórico tem ${parsed.length} mensagens`);

                parsed.forEach((msg, i) => {
                    log(`  [${i}] ${msg.role}: "${msg.text.substring(0, 50)}..."`);

                    // VERIFICA SE É A MENSAGEM DE BOAS-VINDAS
                    if (msg.text.includes('Oi! Eu sou o Chatinho')) {
                        log(`    ⚠️ MENSAGEM DE BOAS-VINDAS ENCONTRADA NO HISTÓRICO!`, 'error');
                    }
                });
            } catch (e) {
                log(`❌ Erro ao parsear: ${e}`, 'error');
            }
        }

        function contarMensagens() {
            log('🔢 CONTANDO MENSAGENS NO DOM...', 'warning');

            // Espera 1 segundo para garantir que o chatbot carregou
            setTimeout(() => {
                const container = document.getElementById('chatbot-messages');

                if (!container) {
                    log('❌ Container de mensagens não encontrado!', 'error');
                    return;
                }

                const mensagens = container.querySelectorAll('.message');
                log(`📨 Total de mensagens no DOM: ${mensagens.length}`);

                mensagens.forEach((msg, i) => {
                    const texto = msg.querySelector('.message-content')?.textContent || '';
                    const role = msg.classList.contains('user-message') ? 'USER' : 'BOT';

                    log(`  [${i}] ${role}: "${texto.substring(0, 50)}..."`);

                    // VERIFICA DUPLICAÇÃO
                    if (texto.includes('Oi! Eu sou o Chatinho')) {
                        log(`    🚨 MENSAGEM DE BOAS-VINDAS ENCONTRADA!`, 'error');
                    }
                });

                // Conta quantas vezes aparece
                const welcomes = Array.from(mensagens).filter(m =>
                    m.textContent.includes('Oi! Eu sou o Chatinho')
                );

                if (welcomes.length > 1) {
                    log(`🔴 DUPLICAÇÃO CONFIRMADA: ${welcomes.length} mensagens de boas-vindas!`, 'error');
                } else if (welcomes.length === 1) {
                    log(`✅ Uma mensagem de boas-vindas (correto)`, 'log');
                } else {
                    log(`❌ Nenhuma mensagem de boas-vindas encontrada`, 'warning');
                }
            }, 1000);
        }

        // Auto-executa
        log('🚀 Debug iniciado');
        log('Aguarde 2 segundos...');

        setTimeout(() => {
            mostrarHistorico();
            contarMensagens();
        }, 2000);
    </script>
</body>
</html>
