# ingest new applications -> silver -> feature snapshots -> score with @champion + drift + monitor
resources:
  jobs:
    credit_risk_batch_scoring:
      name: credit-risk-batch-scoring-${bundle.target}
      description: Score new applications with @champion and refresh monitoring.
      tags:
        project: credit-risk-rai
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 5 * * ?"
        timezone_id: America/Sao_Paulo
      email_notifications:
        on_failure:
          - ${var.alert_email}
      job_clusters:
        - job_cluster_key: ml
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            num_workers: 2
            data_security_mode: SINGLE_USER
            spark_env_vars:
              MLFLOW_DISABLE_AGENT_HINT: "1"
      tasks:
        - task_key: ingest_bronze
          job_cluster_key: ml
          libraries: &wheel
            - whl: ../dist/*.whl
          notebook_task:
            notebook_path: ../notebooks/01_ingest_bronze.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              dataset: new_applications

        - task_key: build_silver
          depends_on: [{ task_key: ingest_bronze }]
          job_cluster_key: ml
          libraries: *wheel
          notebook_task:
            notebook_path: ../notebooks/02_build_silver.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              dataset: new_applications
              max_quarantine_rate: "0.05"

        - task_key: publish_features
          depends_on: [{ task_key: build_silver }]
          job_cluster_key: ml
          libraries: *wheel
          notebook_task:
            notebook_path: ../notebooks/03_publish_features.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              dataset: new_applications

        - task_key: batch_score
          depends_on: [{ task_key: publish_features }]
          job_cluster_key: ml
          libraries: *wheel
          notebook_task:
            notebook_path: ../notebooks/07_batch_score.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              policy_path: ${workspace.file_path}/conf/promotion_policy.yml
              monitor_assets_dir: ${workspace.root_path}/monitoring
