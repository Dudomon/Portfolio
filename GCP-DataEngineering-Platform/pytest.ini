[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=pipelines
    --cov=api/src
    --cov=monitoring/data-quality
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=75

markers =
    unit: Unit tests that don't require external services
    integration: Integration tests that may require mock services
    slow: Tests that take significant time to run
    bigquery: Tests that interact with BigQuery (require credentials)
    dataflow: Tests that interact with Dataflow (require credentials)
    api: Tests for API endpoints

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
