<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forçar Limpeza - Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #FF6B00;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .warning {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
        }

        .btn {
            width: 100%;
            background: #FF6B00;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px 0;
        }

        .btn:hover {
            background: #FF8C42;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 107, 0, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result.success {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
        }

        .status-item {
            padding: 10px;
            margin: 10px 0;
            background: #f8f9fa;
            border-radius: 5px;
            border-left: 4px solid #17a2b8;
        }

        .code {
            background: #1e1e1e;
            color: #0f0;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            margin: 10px 0;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 Forçar Limpeza Total</h1>
        <p class="subtitle">Limpa TUDO relacionado ao chatbot</p>

        <div class="warning">
            <strong>⚠️ O que este script faz:</strong>
            <ul style="margin-left: 20px; margin-top: 10px;">
                <li>Limpa TODO o localStorage</li>
                <li>Limpa o cache do Service Worker (se existir)</li>
                <li>Força reload SEM cache</li>
                <li>Remove TODOS os dados salvos do chatbot</li>
            </ul>
        </div>

        <div id="status"></div>

        <button class="btn" onclick="limparTudo()">
            🗑️ LIMPAR TUDO E RECARREGAR
        </button>

        <button class="btn btn-secondary" onclick="verificarEstado()">
            🔍 Verificar Estado Atual
        </button>

        <div id="result" class="result"></div>
    </div>

    <script>
        function adicionarStatus(mensagem) {
            const statusDiv = document.getElementById('status');
            const item = document.createElement('div');
            item.className = 'status-item';
            item.textContent = mensagem;
            statusDiv.appendChild(item);
        }

        function verificarEstado() {
            const resultDiv = document.getElementById('result');
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '';
            resultDiv.className = 'result';
            resultDiv.innerHTML = '';

            adicionarStatus('📊 Verificando estado do localStorage...');

            const history = localStorage.getItem('radioChatbotHistory');
            const version = localStorage.getItem('radioChatbotVersion');

            if (history) {
                try {
                    const parsed = JSON.parse(history);
                    adicionarStatus(`📦 Histórico encontrado: ${parsed.length} mensagens`);

                    if (parsed.length > 10) {
                        adicionarStatus(`⚠️ PROBLEMA: Histórico muito grande! (${parsed.length} > 10)`);
                    } else {
                        adicionarStatus(`✅ Histórico OK (${parsed.length} mensagens)`);
                    }
                } catch (e) {
                    adicionarStatus(`❌ Histórico CORROMPIDO: ${e.message}`);
                }
            } else {
                adicionarStatus('✅ Nenhum histórico salvo');
            }

            if (version) {
                adicionarStatus(`📌 Versão: ${version}`);
            } else {
                adicionarStatus('⚠️ Sem versão definida (precisa atualizar)');
            }

            // Mostra todo o localStorage
            const allKeys = Object.keys(localStorage);
            if (allKeys.length > 0) {
                adicionarStatus(`🗄️ Total de itens no localStorage: ${allKeys.length}`);
                allKeys.forEach(key => {
                    const value = localStorage.getItem(key);
                    const size = new Blob([value]).size;
                    adicionarStatus(`   - ${key}: ${size} bytes`);
                });
            }
        }

        function limparTudo() {
            const resultDiv = document.getElementById('result');
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '';

            adicionarStatus('🗑️ Iniciando limpeza total...');

            // 1. Limpar localStorage
            const itemsCount = localStorage.length;
            localStorage.clear();
            adicionarStatus(`✅ localStorage limpo (${itemsCount} itens removidos)`);

            // 2. Limpar sessionStorage
            sessionStorage.clear();
            adicionarStatus('✅ sessionStorage limpo');

            // 3. Limpar cookies (se houver)
            document.cookie.split(";").forEach((c) => {
                document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/");
            });
            adicionarStatus('✅ Cookies limpos');

            // 4. Tentar limpar Service Workers
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(registrations => {
                    registrations.forEach(registration => {
                        registration.unregister();
                    });
                    adicionarStatus('✅ Service Workers removidos');
                });
            }

            resultDiv.className = 'result show success';
            resultDiv.innerHTML = `
                <strong>🎉 Limpeza Concluída!</strong><br><br>
                A página será recarregada em 3 segundos SEM cache...<br><br>
                <div class="code">
                    ✓ localStorage ZERADO<br>
                    ✓ sessionStorage ZERADO<br>
                    ✓ Cookies ZERADOS<br>
                    ✓ Service Workers REMOVIDOS
                </div>
            `;

            // Recarregar SEM cache após 3 segundos
            setTimeout(() => {
                // Força reload sem cache
                window.location.href = window.location.href.split('?')[0] + '?nocache=' + Date.now();
            }, 3000);
        }

        // Verifica automaticamente ao carregar
        window.addEventListener('load', verificarEstado);
    </script>
</body>
</html>
