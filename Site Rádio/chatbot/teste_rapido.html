<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Rápido - Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #FF6B00;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        textarea, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        textarea:focus, input:focus {
            outline: none;
            border-color: #FF6B00;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            width: 100%;
            background: #FF6B00;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }

        .btn:hover:not(:disabled) {
            background: #FF8C42;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 107, 0, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #5a6268;
        }

        #result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        #result.show {
            display: block;
        }

        #result.success {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
        }

        #result.error {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
        }

        .response-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            color: #333;
            line-height: 1.6;
        }

        .logs {
            background: #1e1e1e;
            color: #0f0;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            display: none;
        }

        .logs.show {
            display: block;
        }

        .log-line {
            margin: 4px 0;
        }

        .log-line.info { color: #0ff; }
        .log-line.success { color: #0f0; }
        .log-line.error { color: #f00; }
        .log-line.warning { color: #ff0; }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            vertical-align: middle;
            margin-left: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .stat-item {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-label {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Teste Rápido do Chatbot</h1>
        <p class="subtitle">Teste direto da API sem WordPress</p>

        <div class="input-group">
            <label for="apiUrl">URL da API:</label>
            <input type="text" id="apiUrl" value="/chatbot/chat_api.php" placeholder="/chatbot/chat_api.php">
        </div>

        <div class="input-group">
            <label for="message">Mensagem de Teste:</label>
            <textarea id="message" placeholder="Digite sua mensagem aqui...">Olá! Qual é a frequência da rádio?</textarea>
        </div>

        <button class="btn" onclick="enviarTeste()" id="sendBtn">
            🚀 Enviar Teste
        </button>

        <button class="btn btn-secondary" onclick="toggleLogs()">
            📋 Mostrar/Ocultar Logs
        </button>

        <div id="result"></div>

        <div id="logs" class="logs"></div>
    </div>

    <script>
        let logsVisible = false;
        let requestCount = 0;
        let successCount = 0;
        let errorCount = 0;

        function log(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const timestamp = new Date().toLocaleTimeString();
            const line = document.createElement('div');
            line.className = `log-line ${type}`;
            line.textContent = `[${timestamp}] ${message}`;
            logsDiv.appendChild(line);
            logsDiv.scrollTop = logsDiv.scrollHeight;

            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        function toggleLogs() {
            logsVisible = !logsVisible;
            document.getElementById('logs').classList.toggle('show', logsVisible);
        }

        async function enviarTeste() {
            const apiUrl = document.getElementById('apiUrl').value.trim();
            const message = document.getElementById('message').value.trim();
            const resultDiv = document.getElementById('result');
            const sendBtn = document.getElementById('sendBtn');

            if (!message) {
                alert('Digite uma mensagem!');
                return;
            }

            requestCount++;

            // Limpar resultado anterior
            resultDiv.className = '';
            resultDiv.innerHTML = '';

            // Desabilitar botão
            sendBtn.disabled = true;
            sendBtn.innerHTML = '⏳ Enviando<span class="spinner"></span>';

            log('═══════════════════════════════════════', 'info');
            log(`Teste #${requestCount} iniciado`, 'info');
            log(`API URL: ${apiUrl}`, 'info');
            log(`Mensagem: ${message}`, 'info');

            // Construir URL completa
            let fullUrl = apiUrl;
            if (!apiUrl.startsWith('http')) {
                fullUrl = window.location.origin + apiUrl;
            }

            log(`URL Completa: ${fullUrl}`, 'info');

            // Corpo da requisição
            const requestBody = {
                message: message,
                history: [
                    { role: 'user', text: 'Oi' },
                    { role: 'bot', text: 'Olá! Como posso ajudar?' }
                ]
            };

            log(`Request Body: ${JSON.stringify(requestBody, null, 2)}`, 'info');

            try {
                const startTime = performance.now();

                const response = await fetch(fullUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });

                const endTime = performance.now();
                const duration = Math.round(endTime - startTime);

                log(`Status HTTP: ${response.status} ${response.statusText}`,
                    response.ok ? 'success' : 'error');
                log(`Tempo de resposta: ${duration}ms`, 'info');

                const data = await response.json();
                log(`Resposta JSON: ${JSON.stringify(data, null, 2)}`, 'info');

                if (data.success) {
                    successCount++;
                    resultDiv.className = 'show success';
                    resultDiv.innerHTML = `
                        <strong>✅ Sucesso!</strong><br><br>
                        <strong>Resposta do Chatinho:</strong>
                        <div class="response-box">
                            ${data.data.message}
                        </div>
                        <div class="stats">
                            <div class="stat-item">
                                <div class="stat-label">Modelo</div>
                                <div class="stat-value">${data.data.model || 'N/A'}</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">Tempo</div>
                                <div class="stat-value">${duration}ms</div>
                            </div>
                        </div>
                    `;
                    log('✅ Teste concluído com SUCESSO', 'success');
                } else {
                    errorCount++;
                    resultDiv.className = 'show error';
                    resultDiv.innerHTML = `
                        <strong>❌ Erro na API</strong><br><br>
                        <strong>Mensagem de erro:</strong><br>
                        ${data.error || 'Erro desconhecido'}
                        <br><br>
                        <small>Verifique os logs abaixo para mais detalhes</small>
                    `;
                    log(`❌ ERRO: ${data.error}`, 'error');
                    if (data.details) {
                        log(`Detalhes: ${data.details}`, 'error');
                    }
                }

            } catch (error) {
                errorCount++;
                resultDiv.className = 'show error';
                resultDiv.innerHTML = `
                    <strong>❌ Erro de Conexão</strong><br><br>
                    <strong>Mensagem:</strong><br>
                    ${error.message}
                    <br><br>
                    <strong>Possíveis causas:</strong>
                    <ul style="margin-top: 10px; padding-left: 20px;">
                        <li>Servidor não está rodando</li>
                        <li>URL da API incorreta</li>
                        <li>Problema de CORS</li>
                        <li>Arquivo chat_api.php não encontrado</li>
                    </ul>
                `;
                log(`❌ ERRO DE CONEXÃO: ${error.message}`, 'error');
                log(`Stack: ${error.stack}`, 'error');
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerHTML = '🚀 Enviar Teste';
                log(`Estatísticas: Total=${requestCount} | Sucesso=${successCount} | Erro=${errorCount}`, 'info');
                log('═══════════════════════════════════════', 'info');
            }
        }

        // Permitir Enter para enviar (Shift+Enter para quebra de linha)
        document.getElementById('message').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                enviarTeste();
            }
        });

        // Log inicial
        window.addEventListener('load', function() {
            log('🚀 Página de teste carregada', 'success');
            log(`User Agent: ${navigator.userAgent}`, 'info');
            log(`Origin: ${window.location.origin}`, 'info');
        });
    </script>
</body>
</html>
