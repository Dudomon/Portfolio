name: ledgerflow-ci

on:
  push:
    branches: [main]
    paths: ['LedgerFlow/**', '.github/workflows/ledgerflow-ci.yml']
  pull_request:
    paths: ['LedgerFlow/**', '.github/workflows/ledgerflow-ci.yml']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LedgerFlow/apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: LedgerFlow/apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run build-storybook

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LedgerFlow/services/api
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: ledgerflow
          POSTGRES_PASSWORD: ledgerflow
          POSTGRES_DB: ledgerflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledgerflow"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://ledgerflow:ledgerflow@localhost:5432/ledgerflow_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests migrations
      # API tests apply the real Alembic migration (incl. RLS policies) to this database.
      - run: uv run pytest

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LedgerFlow/services/worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: LedgerFlow/services/worker/go.mod
          cache-dependency-path: LedgerFlow/services/worker/go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1
          working-directory: LedgerFlow/services/worker

  images:
    needs: [web, api, worker]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        context: [LedgerFlow/apps/web, LedgerFlow/services/api, LedgerFlow/services/worker]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
